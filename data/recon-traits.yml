# =========================================================
# Reconstruction Traits
# =========================================================
#
# Canonical registry for Reconstruction traits.
#
# Styles should reference these traits by ID instead of
# repeating their names and descriptions.
#
# Example:
#
# recon_traits:
#   - raging-sea-assault
#   - tactical-balance
#   - all-or-nothing
#   - fleeting-brilliance
#
# =========================================================


