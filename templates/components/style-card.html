<a
  class="style-card rarity-{{ style.rarity }}"
  href="{{ style_url }}"
  title="{{ style.character.en }} — {{ style.style.en }}"
>
  <img
    class="style-portrait"
    src="{{ portrait_url }}"
    alt="{{ style.character.en }} — {{ style.style.en }}"
  >

  <div class="desire-badge">
    <img
      src="{{ desire_url }}"
      alt="{{ style.desire | title }}"
    >
  </div>

  <div class="style-card-name">
    {{ style.character.en }}
  </div>

  <div class="rarity-bar"></div>
</a>
