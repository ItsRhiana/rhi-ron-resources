<div class="style-detail-header">

  <div class="style-detail-portrait-wrap rarity-{{ style.rarity }}">

    <img
      class="style-detail-portrait"
      src="{{ portrait_url }}"
      alt="{{ style.character.en }} — {{ style.style.en }}"
    >

    <div class="style-detail-header-rarity"></div>

  </div>

  <div class="style-detail-heading">

    <h1>
      <span title="{{ style.character.zh | default('') }}">
        {{ style.character.en }}
      </span>

      <span class="style-detail-name-separator">—</span>

      <span title="{{ style.style.zh | default('') }}">
        {{ style.style.en }}
      </span>
    </h1>

    <div class="style-detail-meta">

      <span class="style-detail-meta-item style-detail-rarity">
        {{ style.rarity }}★
      </span>

      <span class="style-detail-meta-item">
        <img src="{{ class_icon_url }}" alt="">
        {{ class_name }}
      </span>

      <span class="style-detail-meta-item">
        <img src="{{ desire_icon_url }}" alt="">
        {{ desire_name }}
      </span>

    </div>

    <div class="style-detail-tags">
{% for tag_id in style.tags | default([]) %}

  {% set tag = tags[tag_id] %}

  <span class="style-detail-tag tag-{{ tag.targeting }}">
    {{ tag.name }}
  </span>

{% endfor %}
    </div>

  </div>

</div>
